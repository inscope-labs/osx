name: merge-spec-amk-console

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pr = open or update a pull request; commit = push to this branch"
        type: choice
        options:
          - pr
          - commit
        default: pr
  push:
    branches: [main]
    paths:
      - 'specs/core/amk-console/**'
      - '!specs/core/amk-console/*.merged.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    uses: ./.github/workflows/merge-spec.yml
    with:
      spec_dir: specs/core/amk-console
      mode: ${{ inputs.mode || 'pr' }}
